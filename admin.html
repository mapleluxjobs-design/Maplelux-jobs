<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard · MapleLux Jobs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  
  <!-- ADDED: Supabase Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <i class="fas fa-leaf"></i>
      <span>Maple<span class="light">Lux</span></span>
    </div>
    <div class="nav-links">
      <a href="index.html">← Back to Job Board</a>
      <a href="#" style="color: #1e6f5c; font-weight: 700;"><i class="fas fa-lock"></i> Admin Access</a>
    </div>
  </header>

  <main class="container" style="max-width: 900px;">
    
    <!-- Admin Dashboard (Visible by default now) -->
    <div id="adminDashboard" style="margin-top: 3rem;">
      
      <!-- SECTION 1: Pending Payments -->
      <div class="category-header" style="margin-top: 0;">
        <div class="icon-badge informal" style="background: #fff4e5; color: #b85e00;"><i class="fas fa-clock"></i></div>
        <h2>Pending Payments (Manual Verification)</h2>
        <span class="tagline">Approve clients who paid via Sendwave / MTN</span>
      </div>

      <div id="pendingList" style="margin-bottom: 4rem;">
        <!-- Pending items will be injected here -->
      </div>

      <!-- SECTION 2: Post a Job -->
      <div class="category-header">
        <div class="icon-badge formal"><i class="fas fa-plus-circle"></i></div>
        <h2>Post a New Job</h2>
        <span class="tagline">Add a new listing to the board</span>
      </div>

      <div class="modal" style="position: relative; display: block; max-width: 100%;">
        <form id="postJobForm">
          <label for="postJobTitleInput">Job Title</label>
          <input type="text" id="postJobTitleInput" placeholder="e.g. Senior Software Engineer" required>

          <label for="postCompany">Company Name</label>
          <input type="text" id="postCompany" placeholder="e.g. Tech Corp" required>

          <label for="postDesc">Job Description</label>
          <textarea id="postDesc" placeholder="Brief description of the role" required style="width: 100%; padding: 0.8rem 1rem; border: 1px solid #d0e2dc; border-radius: 14px; font-size: 0.95rem; background: #f9fdfb; outline: none; margin-bottom: 1rem; min-height: 100px; font-family: inherit;"></textarea>

          <div style="display: flex; gap: 1rem;">
            <div style="flex: 1;">
              <label for="postCountry">Country</label>
              <select id="postCountry" required>
                <option value="canada">🇨🇦 Canada</option>
                <option value="luxembourg">🇱🇺 Luxembourg</option>
              </select>
            </div>
            <div style="flex: 1;">
              <label for="postType">Job Type</label>
              <select id="postType" required>
                <option value="formal">💼 Formal</option>
                <option value="informal">🛠️ Informal</option>
              </select>
            </div>
          </div>

          <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <div style="flex: 1;">
              <label for="postFee">App Fee (CAD/€)</label>
              <input type="number" id="postFee" placeholder="e.g. 15" min="1" required>
            </div>
            <div style="flex: 1;">
              <label for="postSalary">Salary / Rate</label>
              <input type="text" id="postSalary" placeholder="e.g. CAD 100k">
            </div>
          </div>

          <button type="submit" class="btn-pay" style="margin-top: 1.5rem;">
            <i class="fas fa-check"></i> Publish Job
          </button>
        </form>
      </div>

    </div>
  </main>

  <script>
    // === SUPABASE CREDENTIALS ===
    const SUPABASE_URL = 'https://erugiqutafquqxbaekd.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_AfZsPHIN8REUncmvk-5nvg_WNg443aZ'; 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Load data immediately on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadPendingPayments();
    });

    // --- LOAD & APPROVE PENDING PAYMENTS (FROM SUPABASE) ---
    async function loadPendingPayments() {
      const pendingList = document.getElementById('pendingList');
      
      const { data: pendingBookings, error } = await supabase
        .from('pending_payments')
        .select('*')
        .eq('status', 'pending');

      if (error) {
        pendingList.innerHTML = `<p style="color: red;">Error loading payments: ${error.message}</p>`;
        return;
      }

      if (pendingBookings.length === 0) {
        pendingList.innerHTML = `<p style="color: #6b8f86; text-align: center; padding: 2rem; background: white; border-radius: 16px; border: 1px solid #e2f0ea;">No pending payments to verify.</p>`;
        return;
      }

      pendingList.innerHTML = pendingBookings.map(booking => `
        <div class="premium-receipt" style="margin-bottom: 1.5rem;">
          <div class="receipt-header" style="background: #fff4e5; color: #b85e00;">
            <i class="fas fa-clock"></i> Pending Verification: ${booking.name} (${booking.country})
          </div>
          <div class="receipt-body">
            <div class="receipt-row"><span>Job:</span> <strong>${booking.job_title}</strong></div>
            <div class="receipt-row"><span>Email:</span> <strong>${booking.email}</strong></div>
            <div class="receipt-row"><span>Phone:</span> <strong>${booking.phone}</strong></div>
            <div class="receipt-row"><span>Date & Time:</span> <strong>${booking.date} at ${booking.time}</strong></div>
            <div class="receipt-row"><span>Office:</span> <strong>${booking.office_location}</strong></div>
            
            <div style="margin-top: 1rem; display: flex; gap: 1rem;">
              <button onclick="approvePayment(${booking.id})" class="btn-pay" style="background: #1e6f5c; padding: 0.8rem;">
                <i class="fas fa-check"></i> Approve & Send Email
              </button>
              <button onclick="rejectPayment(${booking.id})" class="btn-back" style="padding: 0.8rem; color: #d63031; background: #ffebeb;">
                <i class="fas fa-times"></i> Reject
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // --- APPROVE PAYMENT ---
    window.approvePayment = async function(id) {
      const { data: booking } = await supabase.from('pending_payments').select('*').eq('id', id).single();
      if (!booking) return;

      try {
        // Send the final confirmation email to the client
        await fetch('https://maplelux-jobs.onrender.com/api/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to: booking.email,
            name: booking.name,
            jobTitle: booking.job_title,
            date: booking.date,
            time: booking.time,
            missingDocs: booking.missing_docs,
            officeLocation: booking.office_location
          })
        });

        // Mark as approved in Supabase
        await supabase.from('pending_payments').update({ status: 'approved' }).eq('id', id);
        
        alert(`✅ Payment Approved. Confirmation email sent to ${booking.email}`);
        loadPendingPayments();

      } catch (error) {
        alert("Error sending email. Check your backend.");
        console.error(error);
      }
    };

    // --- REJECT PAYMENT ---
    window.rejectPayment = async function(id) {
      if (!confirm("Are you sure you want to reject this payment?")) return;
      
      await supabase.from('pending_payments').update({ status: 'rejected' }).eq('id', id);
      loadPendingPayments();
    };

    // --- POST JOB LOGIC ---
    document.getElementById('postJobForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const job = {
        title: document.getElementById('postJobTitleInput').value.trim(),
        company: document.getElementById('postCompany').value.trim(),
        desc: document.getElementById('postDesc').value.trim(),
        country: document.getElementById('postCountry').value,
        type: document.getElementById('postType').value,
        fee: document.getElementById('postFee').value,
        salary: document.getElementById('postSalary').value.trim() || 'Competitive'
      };

      let savedJobs = JSON.parse(localStorage.getItem('mapleLuxJobs')) || [];
      savedJobs.push(job);
      localStorage.setItem('mapleLuxJobs', JSON.stringify(savedJobs));

      alert('Job successfully posted! It will now appear on the main job board.');
      document.getElementById('postJobForm').reset();
    });
  </script>
</body>
</html>
